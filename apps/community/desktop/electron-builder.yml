appId: io.dubai.community.desktop
productName: Dubai-io Community
directories:
  output: dist
files:
  - dist-electron/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/icon.ico
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: Dubai-io-Community-${version}-win-x64.exe
