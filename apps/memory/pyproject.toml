[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-memory"
version = "0.0.1"
description = "Personal memory engine: entity-subject graph, queued extraction workers, MCP/API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "psycopg[binary]>=3.2", "celery>=5.5", "redis>=5.0",
  "httpx>=0.27", "json-repair>=0.30",
]

[project.optional-dependencies]
cloud = ["anthropic"]          # internal-cloud runner (Haiku); model id from env
mcp = ["mcp"]                  # MCP server (WP-D)
semantic = ["onnxruntime>=1.19", "tokenizers>=0.20", "huggingface-hub>=0.24", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
tm = "temporal_memory.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
