# temporal-memory stack. Usage:
#   docker compose up -d postgres rabbitmq redis          # infra only (tests, local dev)
#   docker compose up -d api worker-p0 worker-p1 beat     # service + workers
# Agent-CLI and owner-hook workers run on the host and claim through the API/MCP (planaudit §6, §9).
name: temporal-memory

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: tm
      POSTGRES_DB: tm
    ports: ["5442:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tm", "-d", "tm"], interval: 5s, timeout: 5s, retries: 10}

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5682:5672", "15682:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "ping"], interval: 10s, timeout: 5s, retries: 5}

  redis:
    image: redis:7-alpine
    ports: ["6390:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}

  api:
    build: .
    command: ["uvicorn", "temporal_memory.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8040"]
    env_file: [{path: .env, required: false}]
    environment: &tm_env
      TM_DATABASE_URL: postgresql://tm:tm@postgres:5432/tm
      TM_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      TM_REDIS_URL: redis://redis:6379/0
      TM_LMSTUDIO_URL: http://host.docker.internal:1234/v1
      HF_HOME: /home/tm/.cache/huggingface   # bge-m3 (~570 MB) lives in the tm-hf-cache volume: downloaded once
    ports: ["8040:8040"]
    volumes: &hf_cache [tm-hf-cache:/home/tm/.cache/huggingface]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, redis: {condition: service_healthy}}
    # The app factory migrates Postgres before this endpoint becomes available.
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8040/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker-p0:   # reserved for live (P0) jobs so imports can never starve the chat badge
    build: .
    command: ["celery", "-A", "temporal_memory.queue.celery_app", "worker", "-Q", "mem.p0", "--concurrency=1", "-n", "p0@%h", "--loglevel=INFO"]
    env_file: [{path: .env, required: false}]
    environment: *tm_env
    volumes: *hf_cache
    depends_on: &api_ready {api: {condition: service_healthy}}
    healthcheck: &worker_health
      test: ["CMD-SHELL", "celery -A temporal_memory.queue.celery_app inspect --timeout=3 --destination=\"p0@$$HOSTNAME\" ping"]
      interval: 10s
      timeout: 8s
      retries: 5

  worker-p1:   # imports, nightly, reflect
    build: .
    command: ["celery", "-A", "temporal_memory.queue.celery_app", "worker", "-Q", "mem.p1,mem.p3", "--concurrency=2", "-n", "p1@%h", "--loglevel=INFO"]
    env_file: [{path: .env, required: false}]
    environment: *tm_env
    volumes: *hf_cache
    depends_on: *api_ready
    healthcheck:
      <<: *worker_health
      test: ["CMD-SHELL", "celery -A temporal_memory.queue.celery_app inspect --timeout=3 --destination=\"p1@$$HOSTNAME\" ping"]

  beat:        # outbox publisher + reconciler (expired leases, unpublished jobs)
    build: .
    command: ["celery", "-A", "temporal_memory.queue.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file: [{path: .env, required: false}]
    environment: *tm_env
    depends_on: *api_ready
    healthcheck:
      test: ["CMD", "python", "-c", "from temporal_memory.queue.celery_app import app; conn = app.connection_for_write(connect_timeout=3); conn.ensure_connection(max_retries=0); conn.release()"]
      interval: 10s
      timeout: 8s
      retries: 5

volumes:
  pg-data:
  rabbitmq-data:
  tm-hf-cache:
