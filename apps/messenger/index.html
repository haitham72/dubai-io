<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iPhone: "Add to Home Screen" opens Messenger full-screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Messenger" />
    <meta name="theme-color" content="#eef3fa" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Messenger</title>
    <!-- Apply the saved theme before first paint (no white flash in dark mode). Mirrors src/store.ts. -->
    <script>
      try {
        var t = localStorage.getItem("messenger.theme");
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
