<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #eef3fa;
        color: #0f172a;
      }
      .card {
        max-width: 440px;
        width: calc(100% - 48px);
        background: #ffffff;
        border: 1px solid #dbe3ef;
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .orb {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #4f46e5, #7c3aed);
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 10px;
        font-size: 14px;
        color: #475569;
        line-height: 1.45;
      }
      code {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 8px;
        background: #f1f5f9;
        color: #1e293b;
        font-size: 12px;
        word-break: break-all;
      }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="orb" aria-hidden="true">&#10022;</div>
      <h1>Messenger is unreachable</h1>
      <p id="reason">Check that the Messenger web app and API are running, then try again.</p>
      <p><code id="target"></code></p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var target = params.get("target");
        var reason = params.get("reason");
        if (target) document.getElementById("target").textContent = target;
        if (reason) document.getElementById("reason").textContent = reason;
        document.getElementById("retry").addEventListener("click", function () {
          if (window.messengerDesktop && typeof window.messengerDesktop.retry === "function") {
            window.messengerDesktop.retry();
          } else if (target) {
            window.location.href = target;
          }
        });
      })();
    </script>
  </body>
</html>
