appId: io.dubai.desktop
productName: Dubai-io
asar: true
directories:
  output: dist-electron
files:
  - electron/**/*
  - renderer/dist/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Code signing is LATER. This dev build is unsigned on purpose (no certificate).
