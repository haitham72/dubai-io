name: Native iOS

on:
  push:
    branches: [ios-swift]
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Swift package contracts
        run: swift test --package-path apps/ios/Core
      - name: Compile native simulator app
        run: >-
          xcodebuild -project apps/ios/DubaiIO.xcodeproj -scheme DubaiIO
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath output/ios-build CODE_SIGNING_ALLOWED=NO build
