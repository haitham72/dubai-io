<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom Care</title>
<style>
  body { margin: 0; font-family: Georgia, serif; background: #FFF6F8; color: #4A2233; }
  .top { text-align: center; padding: 22px 16px 10px; }
  .top h1 { margin: 0; font-weight: normal; font-size: 28px; font-style: italic; color: #B4587A; }
  .top p { margin: 4px 0 0; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9A6A7D; }
  .kit { margin: 12px 14px; background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 4px 16px rgba(180, 88, 122, .1); display: flex; gap: 14px; align-items: center; cursor: pointer; border: 2px solid transparent; }
  .kit.on { border-color: #B4587A; }
  .kit .em { font-size: 36px; } .kit b { display: block; font-size: 17px; } .kit span { font-family: system-ui, sans-serif; font-size: 12px; color: #9A6A7D; }
  .kit .p { margin-left: auto; font-family: system-ui, sans-serif; font-weight: 600; color: #B4587A; }
  .go { display: block; width: calc(100% - 28px); margin: 14px; background: #B4587A; color: #fff; border: 0; border-radius: 999px; padding: 14px; font-family: system-ui, sans-serif; font-weight: 600; font-size: 15px; }
  .go:disabled { opacity: .35; }
  .fine { text-align: center; font-family: system-ui, sans-serif; font-size: 11px; color: #9A6A7D; }
</style></head>
<body>
<div class="top"><h1>Bloom Care</h1><p>Travel &amp; wellness kits · ready in 30 min</p></div>
<div id="kits"></div>
<button class="go" id="go" disabled>Reserve for pickup</button>
<p class="fine">Pay at the counter · demo merchant · prices are demo data</p>
<script>
  const kits = [
    { em: "🌙", name: "Jet-lag kit", d: "Eye mask, electrolytes, moisturiser", price: 79 },
    { em: "☀️", name: "Sun care kit", d: "SPF 50, after-sun gel, lip balm", price: 95 },
    { em: "🍼", name: "Baby travel kit", d: "Wipes, nappy cream, ORS for kids", price: 68 }
  ];
  let pick = null;
  const send = (kind, payload) => parent.postMessage({ v: 1, kind, payload }, "*");
  function draw() {
    document.getElementById("kits").innerHTML = kits.map((k, i) => `<div class="kit ${pick === i ? "on" : ""}" data-i="${i}"><div class="em">${k.em}</div><div><b>${k.name}</b><span>${k.d}</span></div><div class="p">AED ${k.price}</div></div>`).join("");
    document.querySelectorAll("[data-i]").forEach(el => el.onclick = () => { pick = +el.dataset.i; draw(); });
    document.getElementById("go").disabled = pick === null;
  }
  document.getElementById("go").onclick = () => { const k = kits[pick]; send("pickup.request", { items: [{ name: k.name, qty: 1, price: k.price }], estimate: k.price }); };
  draw(); send("app.ready", {});
</script>
</body></html>
