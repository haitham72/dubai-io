<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Shopping mini-app template. One HTML, three partner brands: the host sends {app, signedIn,
     shop:{item, list, shipping, total, eta}}. The purchase happens here, on the provider's own page;
     Dubai-io never charges. The app reports it with purchase.report (its own event). No network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<style>
  :root { --brand: #1F8A5B; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #F5F6F8; color: #14171F; }
  header { background: var(--brand); color: #fff; padding: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  header h1 { margin: 0; font-size: 20px; } header p { margin: 2px 0 0; opacity: .85; font-size: 12.5px; }
  .tag { display: inline-block; background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: 6px; font-size: 11px; margin-top: 10px; }
  .wrap { padding: 14px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 12px; }
  .signin { text-align: center; } .signin h2 { margin: 0 0 6px; font-size: 18px; } .signin p { margin: 0 0 12px; color: #4B5160; font-size: 13.5px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid #D0D5DD; background: #fff; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .gbtn b { font-size: 17px; background: conic-gradient(#EA4335 0 25%, #FBBC05 0 50%, #34A853 0 75%, #4285F4 0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .consent { margin-top: 12px; font-size: 11.5px; color: #6B7280; }
  .who { background: #E8F8EC; color: #1E6B3A; border-radius: 10px; padding: 7px 10px; font-size: 12px; margin-bottom: 10px; }
  .pic { height: 120px; border-radius: 12px; background: linear-gradient(135deg, var(--brand), #14171F); display: grid; place-items: center; font-size: 46px; margin-bottom: 12px; }
  h2.item { margin: 0 0 4px; font-size: 20px; }
  .price { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }
  .sub { color: #4B5160; font-size: 13px; }
  .lines { margin: 10px 0 0; font-size: 14px; }
  .lines div { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid #EEF0F3; }
  .lines .t { font-weight: 800; font-size: 16px; }
  .btn { width: 100%; border: 0; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 15px; background: var(--brand); color: #fff; cursor: pointer; margin-top: 14px; }
  .btn.ghost { background: #EEF0F3; color: #14171F; margin-top: 8px; }
  .ok { text-align: center; } .ok .big { font-size: 44px; }
  .note { font-size: 11.5px; color: #6B7280; margin-top: 10px; }
</style></head>
<body>
<header>
  <div class="brand"><div class="logo" id="logo">S</div><div><h1 id="name">Shop</h1><p id="pub">Partner app</p></div></div>
  <span class="tag">Demo data · demo list prices</span>
</header>
<div class="wrap" id="main"></div>
<script>
  const send = (kind, payload) => parent.postMessage({ v: 1, kind, payload: payload || {} }, "*");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const title = (s) => String(s).replace(/\b\w/g, (c) => c.toUpperCase());
  const $ = (s) => document.querySelector(s);
  let A = null, S = null, signedIn = false, step = "product", orderRef = null;

  function render() {
    if (!A) return;
    document.documentElement.style.setProperty("--brand", A.color || "#1F8A5B");
    $("#logo").textContent = A.logo || "S"; $("#name").textContent = A.name;
    $("#pub").textContent = "Partner app · their own mini-app";
    const m = $("#main");
    if (!signedIn) {
      m.innerHTML = `<div class="card signin"><h2>Sign in to ${esc(A.name)}</h2>
        <p>Use the Google account you already use with Dubai-io. No new password.</p>
        <button class="gbtn" id="go"><b>G</b> Continue with Google (demo)</button>
        <div class="consent">Shares your name and email with ${esc(A.name)}. Dubai-io keeps the sign-in token; this app never sees it.</div></div>`;
      $("#go").onclick = () => send("auth.signin", {});
      return;
    }
    const item = title(S.item);
    if (step === "product") {
      m.innerHTML = `<div class="who">Signed in with Google (demo) · name + email shared with ${esc(A.name)}</div>
        <div class="card"><div class="pic">📦</div><h2 class="item">${esc(item)}</h2>
        <div class="price">AED ${S.total} (demo)</div>
        <div class="sub">List AED ${S.list} (demo) + shipping ${S.shipping ? "AED " + S.shipping + " (demo)" : "free"} · arrives ${esc(S.eta)}</div>
        <button class="btn" id="buy">Buy now</button></div>
        <div class="note">You pay here, on ${esc(A.name)}'s page. Dubai-io never charges or sees your card.</div>`;
      $("#buy").onclick = () => { step = "confirm"; render(); };
    } else if (step === "confirm") {
      m.innerHTML = `<div class="card"><h2 class="item">Confirm your order</h2>
        <div class="lines"><div><span>${esc(item)}</span><span>AED ${S.list} (demo)</span></div>
        <div><span>Shipping</span><span>${S.shipping ? "AED " + S.shipping + " (demo)" : "Free"}</span></div>
        <div class="t"><span>Total</span><span>AED ${S.total} (demo)</span></div></div>
        <div class="sub" style="margin-top:8px">Delivery: ${esc(S.eta)}</div>
        <button class="btn" id="place">Place order (demo)</button><button class="btn ghost" id="back">Back</button></div>`;
      $("#back").onclick = () => { step = "product"; render(); };
      $("#place").onclick = () => {
        orderRef = (A.logo || "SH") + "-" + String(10000 + Math.floor(Math.random() * 89999));
        step = "done"; render();
        setTimeout(() => send("purchase.report", { order_ref: orderRef, item, total: S.total }), 900);
      };
    } else {
      m.innerHTML = `<div class="card ok"><div class="big">✓</div><h2 class="item">Order placed</h2>
        <div class="sub">${esc(item)} · AED ${S.total} (demo)</div><div class="sub">Order #${esc(orderRef)} · arrives ${esc(S.eta)}</div></div>`;
    }
  }

  window.addEventListener("message", (e) => {
    if (e.source !== parent || !e.data || e.data.v !== 1) return;
    const m = e.data;
    if (m.kind === "host.context") { A = m.payload.app; S = m.payload.shop; signedIn = !!m.payload.signedIn; render(); }
    else if (m.kind === "host.state") { if (m.payload.signedIn) signedIn = true; render(); }
  });
  send("app.ready", {});
</script>
</body></html>
