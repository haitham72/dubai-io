<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Community mini-app template. One HTML, three providers (Dubai-io built-in + two partner apps):
     the host sends {app, signedIn, community:{groups, interests, origin}} and the page brands itself.
     It can only ask: auth.signin, community.join_request. No network (default-src 'none'). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communities</title>
<style>
  :root { --brand: #0A9CC2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #F5F6F8; color: #14171F; }
  header { background: var(--brand); color: #fff; padding: 16px 16px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 800; }
  header h1 { margin: 0; font-size: 20px; } header p { margin: 2px 0 0; opacity: .85; font-size: 12.5px; }
  .tag { display: inline-block; background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: 6px; font-size: 11px; margin-top: 10px; }
  .wrap { padding: 14px; }
  .signin { background: #fff; border-radius: 14px; padding: 18px 16px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .signin h2 { margin: 0 0 6px; font-size: 18px; }
  .signin p { margin: 0 0 12px; color: #4B5160; font-size: 13.5px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid #D0D5DD; background: #fff; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .gbtn b { font-size: 17px; background: conic-gradient(#EA4335 0 25%, #FBBC05 0 50%, #34A853 0 75%, #4285F4 0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .consent { margin-top: 12px; font-size: 11.5px; color: #6B7280; }
  .who { background: #E8F8EC; color: #1E6B3A; border-radius: 10px; padding: 7px 10px; font-size: 12px; margin-bottom: 10px; }
  .q { font-size: 13px; color: #4B5160; margin: 0 0 10px; }
  .g { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .g h3 { margin: 0; font-size: 15.5px; } .g .line { color: #4B5160; font-size: 13px; margin-top: 2px; }
  .meta { color: #6B7280; font-size: 12px; margin-top: 6px; }
  .m { display: inline-block; background: #E3F6FB; color: #0A7A99; border-radius: 999px; padding: 2px 8px; font-size: 11.5px; font-weight: 600; margin: 6px 4px 0 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
  .btn { border: 0; border-radius: 10px; padding: 9px 13px; font-weight: 600; font-size: 14px; background: var(--brand); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .none { background: #FFF3E0; color: #8A4B00; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 10px; }
  footer { padding: 4px 16px 24px; color: #6B7280; font-size: 11px; }
</style></head>
<body>
<header>
  <div class="brand"><div class="logo" id="logo">C</div><div><h1 id="name">Communities</h1><p id="pub">Partner app</p></div></div>
  <span class="tag">Demo data · synthetic groups, no real people</span>
</header>
<div class="wrap" id="main"></div>
<footer>Groups show an approximate area only. Joining always needs the group's own accept.</footer>
<script>
  const send = (kind, payload) => parent.postMessage({ v: 1, kind, payload: payload || {} }, "*");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const label = (t) => ({ ai: "AI" }[t] || t.charAt(0).toUpperCase() + t.slice(1));
  const $ = (s) => document.querySelector(s);
  let C = null, A = null, signedIn = false;
  const sent = new Set();

  function render() {
    if (!A) return;
    document.documentElement.style.setProperty("--brand", A.color || "#0A9CC2");
    $("#logo").textContent = A.logo || "C"; $("#name").textContent = A.name;
    $("#pub").textContent = A.publisher === "dubai-io" ? "Built-in · Dubai-io" : "Partner app · their own mini-app";
    if (!signedIn) {
      $("#main").innerHTML = `<div class="signin"><h2>Sign in to ${esc(A.name)}</h2>
        <p>Use the Google account you already use with Dubai-io. No new password.</p>
        <button class="gbtn" id="go"><b>G</b> Continue with Google (demo)</button>
        <div class="consent">Shares your name and email with ${esc(A.name)}. Dubai-io keeps the sign-in token; this app never sees it.</div></div>`;
      $("#go").onclick = () => send("auth.signin", {});
      return;
    }
    const want = [...(C.interests || []), ...(C.origin ? [C.origin] : [])];
    const anyMatch = C.groups.some((g) => g.match.length);
    $("#main").innerHTML =
      `<div class="who">Signed in with Google (demo) · name + email shared with ${esc(A.name)}</div>` +
      (want.length ? `<p class="q">Looking for: <b>${esc(want.map(label).join(" · "))}</b></p>` : "") +
      (want.length && !anyMatch ? `<div class="none">No exact match here. Showing what ${esc(A.name)} has.</div>` : "") +
      C.groups.map((g) => `<div class="g"><h3>${esc(g.name)}</h3><div class="line">${esc(g.line || "")}</div>
        <div class="meta">${esc(g.kind)} · ${esc(g.members)} · ${esc(g.area)}</div>
        ${g.match.map((t) => `<span class="m">✓ ${esc(label(t))}</span>`).join("")}
        <div class="row"><span></span><button class="btn" data-g="${esc(g.id)}" ${sent.has(g.id) ? "disabled" : ""}>${sent.has(g.id) ? "Waiting for your approval in chat" : "Request to join"}</button></div></div>`).join("");
    document.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => { sent.add(b.dataset.g); send("community.join_request", { group_id: b.dataset.g }); }));
  }

  window.addEventListener("message", (e) => {
    if (e.source !== parent || !e.data || e.data.v !== 1) return;
    const m = e.data;
    if (m.kind === "host.context") { A = m.payload.app; C = m.payload.community; signedIn = !!m.payload.signedIn; render(); }
    else if (m.kind === "host.state") { if (m.payload.signedIn) signedIn = true; render(); }
  });
  send("app.ready", {});
</script>
</body></html>
