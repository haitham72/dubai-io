<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold &amp; Press Laundry</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #FBF7EF; color: #2B2418; }
  h1 { margin: 0; padding: 18px 16px 4px; font-size: 22px; } .sub { padding: 0 16px; color: #7A6B52; font-size: 13px; }
  .box { margin: 14px; background: #fff; border-radius: 14px; padding: 14px; border: 1px solid #EADFC9; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .step { display: flex; gap: 10px; align-items: center; }
  .step button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid #C9A86A; background: #fff; font-size: 18px; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .slots button { border: 1px solid #EADFC9; background: #fff; border-radius: 10px; padding: 9px 4px; font-size: 12px; }
  .slots button.on { background: #F1E3C4; border-color: #C9A86A; font-weight: 600; }
  .go { display: block; width: calc(100% - 28px); margin: 0 14px; background: #C9A86A; border: 0; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 15px; }
</style></head>
<body>
<h1>Fold &amp; Press</h1><div class="sub">Shirt ironing · pickup and drop-off</div>
<div class="box"><div class="row"><div><b>Shirts</b><div class="sub" style="padding:0">AED 5 each (demo)</div></div>
  <div class="step"><button id="m">−</button><b id="n">5</b><button id="p">+</button></div></div></div>
<div class="box"><b>Pickup</b><div class="slots" id="slots"></div></div>
<button class="go" id="go">Request quote</button>
<script>
  let n = 5, slot = 0; const slots = ["Today 18:00", "Today 21:00", "Tomorrow 08:00"];
  const send = (kind, payload) => parent.postMessage({ v: 1, kind, payload }, "*");
  function draw() {
    document.getElementById("n").textContent = n;
    document.getElementById("slots").innerHTML = slots.map((s, i) => `<button class="${i === slot ? "on" : ""}" data-i="${i}">${s}</button>`).join("");
    document.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { slot = +b.dataset.i; draw(); });
  }
  document.getElementById("m").onclick = () => { n = Math.max(1, n - 1); draw(); };
  document.getElementById("p").onclick = () => { n++; draw(); };
  document.getElementById("go").onclick = () => send("order.request", { items: [{ name: "Shirt ironing", qty: n, price: 5 }], summary: `${n} shirts · ${slots[slot]}`, estimate: n * 5 });
  draw(); send("app.ready", {});
</script>
</body></html>
